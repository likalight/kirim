<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIRIM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Retia Labs design system — cream and ink, hairlines, sharp corners. */
  :root{
    --paper-0:#FAF6EE; --paper-1:#F1ECE1; --paper-2:#E8E2D4; --paper-3:#DED7C6;
    --ink-0:#17130D; --ink-2:#514A3C; --ink-3:#6A6356; --ink-4:#8C8467;
    --panel-0:#0F0D09; --panel-1:#1A1712; --panel-2:#262119;
    --panel-ink:#D9D3C5; --panel-muted:#9B9483; --panel-faint:#7D766A;
    --trusted:#2C5A4E; --candidate:#4E7A5B; --contested:#B07A22;
    --quarantined:#A23B2C; --restricted:#7A2E2E; --sage:#5E9B79;
    --trusted-tint:#DCE6E0; --contested-tint:#EFE4CB; --quarantined-tint:#EFDAD2;
    --font-display:'Newsreader',Georgia,serif;
    --font-sans:'Archivo',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper-1);color:var(--ink-0);
    font-family:var(--font-sans);font-size:15px;line-height:1.55}
  a{color:var(--trusted)}

  header{border-bottom:1px solid var(--ink-0);padding:14px 26px;display:flex;
    flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:baseline;gap:14px}
  h1{font-family:var(--font-display);font-size:25px;margin:0;font-weight:400;letter-spacing:-.01em}
  .tag{color:var(--ink-4);font-size:12px;font-family:var(--font-mono);letter-spacing:.1em}

  .who{display:flex;border:1px solid var(--ink-0)}
  .who button{font:inherit;font-size:13px;font-weight:600;padding:7px 16px;border:0;
    background:transparent;color:var(--ink-2);cursor:pointer}
  .who button[aria-pressed="true"]{background:var(--ink-0);color:var(--paper-1)}
  .who button:focus-visible{outline:2px solid var(--trusted);outline-offset:2px}

  .live{display:inline-block;width:7px;height:7px;background:var(--ink-4);margin-right:7px}
  .live.on{background:var(--trusted)}
  .status{color:var(--ink-4);font-size:12px;font-family:var(--font-mono);letter-spacing:.08em}

  main{display:grid;grid-template-columns:minmax(360px,1fr) minmax(400px,1.05fr);
    min-height:calc(100vh - 60px)}
  @media (max-width:1000px){main{grid-template-columns:1fr}}
  .pane{padding:24px 26px}
  .pane+.pane{border-left:1px solid var(--paper-3)}
  @media (max-width:1000px){.pane+.pane{border-left:none;border-top:1px solid var(--paper-3)}}

  h2{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-4);margin:0 0 12px;font-weight:400}
  h2:not(:first-of-type){margin-top:26px}

  .headline{border:1px solid var(--paper-3);background:var(--paper-0);padding:18px 20px}
  .headline .lede{font-family:var(--font-display);font-size:17px;line-height:1.35;color:var(--ink-2)}
  .headline .big{font-family:var(--font-display);font-size:40px;line-height:1.1;margin-top:4px;
    font-variant-numeric:tabular-nums}
  .headline .sub{font-size:13px;color:var(--ink-3);margin-top:6px}
  .headline.good{border-left:3px solid var(--trusted)}
  .headline.wait{border-left:3px solid var(--contested)}

  .figs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--paper-3);
    border:1px solid var(--paper-3);margin-top:14px}
  .figs div{background:var(--paper-0);padding:11px 13px}
  .figs dt{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-4)}
  .figs dd{margin:4px 0 0;font-family:var(--font-display);font-size:19px;
    font-variant-numeric:tabular-nums}

  .ms{border:1px solid var(--paper-3);background:var(--paper-0);margin-bottom:8px;
    display:grid;grid-template-columns:6px 1fr auto;width:100%;
    font:inherit;color:inherit;text-align:left;cursor:pointer}
  .ms:hover{border-color:var(--trusted)}
  .ms:focus-visible{outline:2px solid var(--trusted);outline-offset:2px}
  .ms[disabled]{opacity:.5;cursor:default}
  .ms .bar{background:var(--paper-3)}
  .ms.released .bar{background:var(--trusted)}
  .ms.flagged .bar{background:var(--quarantined)}
  .ms.more_info .bar,.ms.awaiting_client .bar{background:var(--contested)}
  .ms.returned .bar{background:var(--restricted)}
  .ms .body{padding:12px 14px}
  .ms .top{display:flex;gap:10px;align-items:baseline}
  .ms .id{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-4);letter-spacing:.1em}
  .ms .nm{font-weight:600;font-size:14.5px}
  .ms .sc{font-size:12.5px;color:var(--ink-3);margin-top:3px}
  .ms .right{padding:12px 14px;text-align:right;align-self:center;white-space:nowrap}
  .ms .amt{font-family:var(--font-mono);font-size:13px;color:var(--ink-0);
    font-variant-numeric:tabular-nums}
  .pill{display:inline-block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;padding:2px 7px;margin-top:5px}
  .pill.released{background:var(--trusted-tint);color:var(--trusted)}
  .pill.flagged{background:var(--quarantined-tint);color:var(--quarantined)}
  .pill.more_info,.pill.awaiting_client{background:var(--contested-tint);color:var(--contested)}
  .pill.returned{background:var(--quarantined-tint);color:var(--restricted)}
  .pill.unknown,.pill.in_progress{background:var(--paper-2);color:var(--ink-4)}

  .partner{border:1px solid var(--paper-3);background:var(--panel-0);padding:16px 18px}
  .partner .nm{font-family:var(--font-display);font-size:19px;color:var(--panel-ink)}
  .partner .uen{font-family:var(--font-mono);font-size:11px;color:var(--panel-faint);margin-top:2px}
  .partner .row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;
    color:var(--panel-ink);border-bottom:1px solid var(--panel-2)}
  .partner .row:last-of-type{border-bottom:none}
  .partner .row span:first-child{color:var(--panel-muted)}
  .partner .verified{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--sage);margin-top:12px}
  .partner .addr{font-family:var(--font-mono);font-size:10px;color:var(--panel-faint);
    margin-top:4px;word-break:break-all}

  .action{border:1px solid var(--contested);background:var(--contested-tint);padding:16px 18px;margin-top:14px}
  .action h3{margin:0 0 4px;font-family:var(--font-display);font-size:18px;font-weight:400}
  .action p{margin:0 0 12px;font-size:13.5px;color:var(--ink-2)}
  .action dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0 0 14px;
    font-family:var(--font-mono);font-size:11px}
  .action dt{color:var(--ink-4)}
  .action dd{margin:0;color:var(--ink-0);word-break:break-all}
  .btn{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border:1px solid var(--ink-0);
    background:var(--ink-0);color:var(--paper-1);cursor:pointer}
  .btn:hover{background:var(--ink-2);border-color:var(--ink-2)}
  .btn.ghost{background:transparent;color:var(--ink-0)}
  .btn.ghost:hover{background:var(--paper-2)}
  .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .action input{font-family:var(--font-mono);font-size:11px;padding:7px 9px;flex:1;min-width:210px;
    border:1px solid var(--paper-3);background:var(--paper-0);color:var(--ink-0)}
  .err{color:var(--quarantined);font-size:12.5px;margin-top:8px}
  .ok{color:var(--trusted);font-size:12.5px;margin-top:8px}

  .feed{border:1px solid var(--paper-3);background:var(--paper-0)}
  .row{display:grid;grid-template-columns:104px 1fr;gap:0 16px;padding:11px 15px;
    border-bottom:1px solid var(--paper-2)}
  .row:last-child{border-bottom:none}
  .row .stage{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-4);padding-top:3px}
  .row .decision{font-weight:600;font-size:13.5px}
  .row .reason{color:var(--ink-2);font-size:13px;margin-top:2px}
  .row a{font-family:var(--font-mono);font-size:10.5px;display:inline-block;margin-top:5px;
    word-break:break-all}
  .row .cost{float:right;font-family:var(--font-mono);font-size:12px;color:var(--trusted);
    font-variant-numeric:tabular-nums}
  .row.settlement.released,.row.revenue{background:var(--trusted-tint)}
  .row.settlement.returned{background:var(--quarantined-tint)}
  .row.authorisation{background:var(--contested-tint)}
  .row.comparison .stage,.row .decision.chose{color:var(--candidate)}
  .row .decision.flagged,.row .decision.withheld,.row .decision.unverified{color:var(--quarantined)}
  .row .decision.more_info,.row .decision.held,.row .decision.awaiting_client{color:var(--contested)}
  .row .decision.declined{color:var(--restricted)}
  .row .decision.ready,.row .decision.released,.row .decision.credentialed,
  .row .decision.verified,.row .decision.charged{color:var(--trusted)}
  .empty{color:var(--ink-4);font-size:13.5px;padding:26px 15px;text-align:center}
  .note{color:var(--ink-4);font-size:12px;margin-top:14px;line-height:1.5}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>KIRIM</h1>
    <span class="tag" id="tagline">TRUST BEFORE YOU BUILD</span>
  </div>
  <div class="who" role="group" aria-label="View as">
    <button id="as-client" aria-pressed="true">Sarah — client</button>
    <button id="as-contractor" aria-pressed="false">ABC Renovation — contractor</button>
  </div>
  <div class="status"><span class="live" id="live"></span><span id="livetext">connecting</span></div>
</header>

<main>
  <section class="pane">
    <div id="headline"></div>
    <h2 id="listTitle">Milestones</h2>
    <div id="milestones"></div>
    <div id="action"></div>
    <h2 id="partnerTitle">Contractor</h2>
    <div id="partner"></div>
    <p class="note" id="footnote"></p>
  </section>

  <section class="pane">
    <h2 id="feedTitle">Activity</h2>
    <div class="feed" id="feed"><div class="empty">Open a milestone to begin.</div></div>
  </section>
</main>

<script>
const money = (c) => 'S$' + (c / 100).toLocaleString('en-SG', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const money2 = (c) => 'S$' + (c / 100).toLocaleString('en-SG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

let role = 'client';
let project = null, state = {}, record = null, pending = [];
let running = false;

const STATUS_WORDS = {
  client: {
    released: 'paid', flagged: 'needs your review', more_info: 'waiting on contractor',
    awaiting_client: 'needs your signature', returned: 'refunded to you',
    in_progress: 'in progress', unknown: 'not started',
  },
  contractor: {
    released: 'you were paid', flagged: 'held — see why', more_info: 'send more evidence',
    awaiting_client: 'awaiting client signature', returned: 'expired',
    in_progress: 'in progress', unknown: 'not submitted',
  },
};

async function load() {
  const [p, st, rec, pen] = await Promise.all([
    fetch('/api/project').then((r) => r.json()),
    fetch('/api/state').then((r) => r.json()).catch(() => ({ milestones: {} })),
    fetch('/api/record').then((r) => r.json()).catch(() => null),
    fetch('/api/pending').then((r) => r.json()).catch(() => ({ pending: [] })),
  ]);
  project = p; state = st.milestones || {}; record = rec; pending = pen.pending || [];
  render();
}

function totals() {
  let paid = 0, held = 0, committed = 0, fees = 0;
  for (const m of project.milestones) {
    const s = state[m.id];
    if (!s) continue;
    if (s.status === 'released') {
      paid += m.amountCents;
      if (s.feeUsd) fees += Math.round(Number(s.feeUsd) * 100);
    } else if (['flagged', 'more_info', 'awaiting_client'].includes(s.status)) {
      held += m.amountCents;
    }
    if (s.status !== 'unknown' && s.status !== 'returned') committed += m.amountCents;
  }
  return { paid, held, committed, fees };
}

function render() {
  document.getElementById('as-client').setAttribute('aria-pressed', role === 'client');
  document.getElementById('as-contractor').setAttribute('aria-pressed', role === 'contractor');
  document.getElementById('tagline').textContent =
    role === 'client' ? 'TRUST BEFORE YOU BUILD' : 'PAID ON EVIDENCE, NOT ON TERMS';
  renderHeadline();
  renderMilestones();
  renderAction();
  renderPartner();
  document.getElementById('feedTitle').textContent =
    role === 'client' ? 'What Kirim is doing with your money' : 'What Kirim checked';
  document.getElementById('footnote').textContent = role === 'client'
    ? 'Your money for each milestone is locked on the XRP Ledger before work starts. Kirim cannot spend it, and neither can the contractor until the evidence matches what you agreed.'
    : 'Every released milestone is written to your own XRPL account as a credential. It is yours, any future client can check it, and it does not depend on Kirim still existing.';
}

function renderHeadline() {
  const t = totals();
  const el = document.getElementById('headline');
  if (role === 'client') {
    const needs = pending.length;
    el.className = 'headline' + (needs ? ' wait' : ' good');
    el.innerHTML =
      '<div class="lede">' + esc(project.name) + '</div>' +
      '<div class="big">' + money(t.committed || project.totalCents) + '</div>' +
      '<div class="sub">' + (needs
        ? '<strong>' + needs + ' milestone needs your signature.</strong> Everything else stays protected until the work is evidenced.'
        : 'protected in escrow — released only against evidence you agreed to.') + '</div>' +
      '<dl class="figs">' +
      '<div><dt>Paid out</dt><dd>' + money(t.paid) + '</dd></div>' +
      '<div><dt>Held back</dt><dd>' + money(t.held) + '</dd></div>' +
      '<div><dt>Kirim fees</dt><dd>' + money2(t.fees) + '</dd></div>' +
      '</dl>';
  } else {
    el.className = 'headline good';
    el.innerHTML =
      '<div class="lede">' + esc(project.name) + ' — ' + esc(project.client) + '</div>' +
      '<div class="big">' + money(t.paid) + '</div>' +
      '<div class="sub">paid to you on evidence, not on 30–60 day terms.' +
        (t.held ? ' <strong>' + money(t.held) + ' is held</strong> pending evidence.' : '') + '</div>' +
      '<dl class="figs">' +
      '<div><dt>Milestones done</dt><dd>' + (record?.milestonesCompleted ?? 0) + '</dd></div>' +
      '<div><dt>On time</dt><dd>' + (record?.onTimeRate == null ? '—' : record.onTimeRate + '%') + '</dd></div>' +
      '<div><dt>Held</dt><dd>' + money(t.held) + '</dd></div>' +
      '</dl>';
  }
}

function lineFor(m, s) {
  const byStatus = role === 'client' ? {
    released: 'Evidence matched what you agreed. Paid in seconds.',
    flagged: 'Something does not add up. Your money is still held.',
    more_info: 'The contractor has not sent enough yet. Nothing is wrong.',
    awaiting_client: 'Above the limit you set — Kirim will not release it without you.',
    returned: 'Nothing was ever delivered. Your money came back.',
  } : {
    released: 'Paid on presentation.',
    flagged: 'Held — the evidence contradicts the agreed scope.',
    more_info: 'Send the missing items and it releases.',
    awaiting_client: 'Everything checked out. Waiting on the client to sign.',
    returned: 'Expired without a submission.',
  };
  return byStatus[s.status] || m.scenario || '';
}

function renderMilestones() {
  document.getElementById('listTitle').textContent =
    role === 'client' ? 'Your milestones' : 'Your jobs on this project';
  const box = document.getElementById('milestones');
  box.innerHTML = '';
  for (const m of project.milestones) {
    const s = state[m.id] || { status: 'unknown' };
    const b = document.createElement('button');
    b.className = 'ms ' + s.status;
    b.disabled = running;
    b.innerHTML =
      '<span class="bar"></span>' +
      '<span class="body"><span class="top"><span class="id">' + m.id + '</span>' +
      '<span class="nm">' + esc(m.name) + '</span></span>' +
      '<div class="sc">' + esc(lineFor(m, s)) + '</div></span>' +
      '<span class="right"><div class="amt">' + money(m.amountCents) + '</div>' +
      '<div class="pill ' + s.status + '">' + esc(STATUS_WORDS[role][s.status] || s.status) + '</div></span>';
    b.onclick = () => run(m.id);
    box.appendChild(b);
  }
}

function renderPartner() {
  const el = document.getElementById('partner');
  document.getElementById('partnerTitle').textContent =
    role === 'client' ? 'Who you hired' : 'Your track record';
  if (role === 'client') {
    el.innerHTML =
      '<div class="partner"><div class="nm">' + esc(project.contractor) + '</div>' +
      '<div class="uen">UEN ' + esc(project.contractorUEN || '—') + '</div>' +
      '<div style="margin-top:12px">' +
      '<div class="row"><span>milestones completed</span><span>' + (record?.milestonesCompleted ?? 0) + '</span></div>' +
      '<div class="row"><span>projects completed</span><span>' + (record?.projectsCompleted ?? 0) + '</span></div>' +
      '<div class="row"><span>delivered on time</span><span>' + (record?.onTimeRate == null ? '—' : record.onTimeRate + '%') + '</span></div>' +
      '</div><div class="verified">verified on the XRP Ledger — not by us</div>' +
      '<div class="addr">' + esc(record?.address || '') + '</div></div>';
  } else {
    el.innerHTML =
      '<div class="partner"><div class="nm">' + (record?.milestonesCompleted ?? 0) + ' milestones on the ledger</div>' +
      '<div class="uen">held on your own XRPL account</div>' +
      '<div style="margin-top:12px">' +
      '<div class="row"><span>on time</span><span>' + (record?.onTimeRate == null ? '—' : record.onTimeRate + '%') + '</span></div>' +
      '<div class="row"><span>projects</span><span>' + (record?.projectsCompleted ?? 0) + '</span></div>' +
      '</div><div class="verified">portable — a future client verifies it without asking Kirim</div>' +
      '<div class="addr">' + esc(record?.address || '') + '</div></div>';
  }
}

function renderAction() {
  const box = document.getElementById('action');
  if (role !== 'client' || !pending.length) { box.innerHTML = ''; return; }
  const p = pending[0], a = p.authorisation;
  const wallets = [];
  if (window.crossmark) wallets.push('<button class="btn" id="w-crossmark">Approve with Crossmark</button>');
  if (window.gemWallet || window.GemWalletApi) wallets.push('<button class="btn" id="w-gem">Approve with GemWallet</button>');

  box.innerHTML =
    '<div class="action"><h3>' + esc(p.name) + ' is ready — it needs you</h3>' +
    '<p>' + money(p.amountCents) + ' is above the limit you set, so Kirim will not release it on its own. ' +
    'The evidence is in order. Approve from your own wallet and the contractor is paid in seconds.</p>' +
    '<dl><dt>to</dt><dd>' + esc(a.to) + '</dd><dt>reference</dt><dd>' + esc(a.memo) + '</dd></dl>' +
    (wallets.length ? '<div class="row2">' + wallets.join('') + '</div>' : '') +
    '<div class="row2" style="margin-top:10px">' +
    '<input id="auth-hash" placeholder="…or paste the transaction hash from any wallet">' +
    '<button class="btn ghost" id="auth-submit">Approve</button></div>' +
    '<div id="auth-msg"></div></div>';

  const msg = (t, cls) => { document.getElementById('auth-msg').innerHTML = '<div class="' + cls + '">' + esc(t) + '</div>'; };
  const submit = async (txHash) => {
    msg('Checking your signature on the ledger…', 'ok');
    const res = await fetch('/api/authorise?key=' + encodeURIComponent(p.key), {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ txHash }),
    });
    if (!res.ok) msg((await res.json()).error || 'Could not approve.', 'err');
  };
  const tx = {
    TransactionType: 'Payment', Destination: a.to,
    Amount: String(Math.round(Number(a.amountXrp) * 1000000)),
    Memos: [{ Memo: { MemoData: toHex(a.memo), MemoType: toHex('kirim/authorise') } }],
  };

  document.getElementById('auth-submit').onclick = () => {
    const v = document.getElementById('auth-hash').value.trim();
    if (!/^[0-9A-Fa-f]{64}$/.test(v)) return msg('That does not look like a transaction hash.', 'err');
    submit(v.toUpperCase());
  };
  const cm = document.getElementById('w-crossmark');
  if (cm) cm.onclick = async () => {
    try {
      msg('Confirm in Crossmark…', 'ok');
      await window.crossmark.methods.signInAndWait();
      const r = await window.crossmark.methods.signAndSubmitAndWait(tx);
      const hash = r?.response?.data?.resp?.result?.hash || r?.data?.resp?.result?.hash;
      hash ? submit(hash) : msg('Crossmark did not return a transaction hash.', 'err');
    } catch (e) { msg('Crossmark: ' + (e.message || e), 'err'); }
  };
  const gw = document.getElementById('w-gem');
  if (gw) gw.onclick = async () => {
    try {
      msg('Confirm in GemWallet…', 'ok');
      const api = window.gemWallet || window.GemWalletApi;
      const r = await api.sendPayment({
        amount: a.amountXrp, destination: a.to,
        memos: [{ memo: { memoData: toHex(a.memo), memoType: toHex('kirim/authorise') } }],
      });
      const hash = r?.result?.hash || r?.hash;
      hash ? submit(hash) : msg('GemWallet did not return a transaction hash.', 'err');
    } catch (e) { msg('GemWallet: ' + (e.message || e), 'err'); }
  };
}

function toHex(s) {
  return Array.from(new TextEncoder().encode(s))
    .map((b) => b.toString(16).padStart(2, '0')).join('').toUpperCase();
}

function run(id) {
  if (running) return;
  running = true;
  document.getElementById('feed').innerHTML = '';
  document.querySelectorAll('.ms').forEach((b) => (b.disabled = true));
  fetch('/api/run?id=' + encodeURIComponent(id), { method: 'POST' });
}

// Each side sees what concerns it. The client does not need the agent's
// shopping; the contractor does not need to watch Kirim take its fee.
const HIDE = {
  client: new Set(['discovery', 'planning', 'comparison']),
  contractor: new Set(['revenue']),
};

const es = new EventSource('/events');
es.onopen = () => {
  document.getElementById('live').classList.add('on');
  document.getElementById('livetext').textContent = 'live';
};
es.onerror = () => {
  document.getElementById('live').classList.remove('on');
  document.getElementById('livetext').textContent = 'reconnecting';
};
es.onmessage = async (ev) => {
  const e = JSON.parse(ev.data);
  if (e.type === 'run_finished' || e.type === 'run_failed') {
    running = false;
    await load();
    return;
  }
  if (e.type !== 'decision') return;
  if (HIDE[role].has(e.stage)) return;

  const row = document.createElement('div');
  row.className = 'row ' + e.stage + ' ' + e.decision;
  const cost = e.costCents ? '<span class="cost">S$' + (e.costCents / 100).toFixed(2) + '</span>' : '';
  const link = e.explorer
    ? '<a href="' + e.explorer + '" target="_blank" rel="noopener">' + e.txHash.slice(0, 28) + '…</a>' : '';
  row.innerHTML =
    '<div class="stage">' + e.stage + '</div>' +
    '<div>' + cost + '<div class="decision ' + e.decision + '">' + e.decision.replace(/_/g, ' ') + '</div>' +
    '<div class="reason">' + esc(e.reason) + '</div>' + link + '</div>';
  document.getElementById('feed').appendChild(row);
  row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
};

document.getElementById('as-client').onclick = () => { role = 'client'; render(); };
document.getElementById('as-contractor').onclick = () => { role = 'contractor'; render(); };

load();
</script>
</body>
</html>
